<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>ACSE AI — Utility Customer Service Automation</title>
    <meta
      name="description"
      content="ACSE AI resolves inbound customer requests, catches billing exceptions, and creates field activities across your entire utility operation."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)" />

    <!--
      Apply the stored theme BEFORE first paint. ThemeProvider sets `.dark` in an
      effect, which runs after the browser has already painted — without this a
      dark-mode visitor gets a white flash on every load. Must stay in sync with
      `initialTheme()` in src/context/ThemeContext.tsx (same key, same fallback).
    -->
    <script>
      try {
        var stored = localStorage.getItem('acse.theme')
        var theme = stored ? JSON.parse(stored) : null
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        /* private mode / storage disabled — fall through to the light default */
      }
    </script>

    <!--
      Apply the stored language + writing direction BEFORE first paint, so the
      document's `lang`/`dir` are correct before React mounts (and an RTL visitor
      would never flash left-to-right). Mirrors `initialLanguage()` in
      src/i18n/index.ts (same key, same fallback) and the direction map in
      src/i18n/config.ts — keep this list in sync with `LANGUAGES` there.
      `I18nProvider` re-stamps both on every language change once React is mounted.
    -->
    <script>
      try {
        var dirs = {
          en: 'ltr', es: 'ltr', fr: 'ltr', pt: 'ltr', it: 'ltr'
        }
        var savedLng = localStorage.getItem('acse.lang')
        var lng = savedLng ? JSON.parse(savedLng) : null
        if (!lng || !dirs[lng]) {
          var nav = (navigator.language || '').slice(0, 2)
          lng = dirs[nav] ? nav : 'en'
        }
        document.documentElement.setAttribute('lang', lng)
        document.documentElement.setAttribute('dir', dirs[lng])
      } catch (e) {
        /* storage disabled — fall through to the html[lang="en"] default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
