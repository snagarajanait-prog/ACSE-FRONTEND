<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <title>ACSE AI — Utility Customer Service Automation</title>
    <meta
      name="description"
      content="ACSE AI resolves inbound customer requests, catches billing exceptions, and creates field activities across your entire utility operation."
    />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1b2a" media="(prefers-color-scheme: dark)" />

    <!--
      Apply the stored theme BEFORE first paint. ThemeProvider sets `.dark` in an
      effect, which runs after the browser has already painted — without this a
      dark-mode visitor gets a white flash on every load. Must stay in sync with
      `initialTheme()` in src/context/ThemeContext.tsx (same key, same fallback).
    -->
    <script>
      try {
        var stored = localStorage.getItem('acse.theme')
        var theme = stored ? JSON.parse(stored) : null
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        if (theme === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {
        /* private mode / storage disabled — fall through to the light default */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
